<!DOCTYPE html>
<html>
    <style>
        .box {
            width: 250px;
            height: 400px;
            margin: 10px;
            border: 3px solid white;
            padding: 10px;
            box-sizing: border-box;
            text-align: center;
        }
        body {
            background-color: #312f2e;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        p {
            color: white;
            text-align: center;
        }

        .colour {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            align-items: center;
            text-shadow: #F8F0F0;
        }
    </style>
    <body>

        <div class="colour">
            <div class="box" style="background-color: #C1ABA6;"><h1>Almond Silk</h1></div>
            <p>Its a colour that fits the theme</p>
        </div>
        
        <div class="colour">
            <div class="box" style="background-color: #362C28;"><h1>Deep Mocha</h1></div>
            <p>A dark brown that fits the coffee theme</p>
        </div>

        <div class="colour">
            <div class="box" style="background-color: #F8F0F0;"><h1>Snow</h1></div>
            <p>An offwhite that would be good to use</p>
        </div>

        <div class="colour">
            <div class="box" style="background-color: #584544;"><h1>Mauve Bark</h1></div>
            <p>Another brown that fits the coffee theme</p>
        </div>

        <div class="colour">
            <div class="box" style="background-color: #E8C79C;"><h1>Apricot Cream</h1></div>
            <p>A cream colour that would look good for buttons</p>
        </div>

    </body>
</html>
