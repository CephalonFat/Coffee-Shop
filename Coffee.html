<!DOCTYPE html>
<html>
    <style>
        .box {
            width: 150px;
            height: 250px;
            margin: 10px;
            border: 3px solid white;
            padding: 10px;
            box-sizing: border-box;
            text-align: center;
        }
        body {
            background-color: #312f2e;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        p {
            color: white;
            text-align: center;
        }
    </style>
    <body>
        <div class="box" style="background-color: #C1ABA6;"></div>
            <p>Almond Silk, its a colour that fits the theme along with the others</p>
        <div class="box" style="background-color: #362C28;"></div>
            <p>Deep Mocha, its a dark brown that fits the coffee theme</p>
        <div class="box" style="background-color: #F8F0F0;"></div>
            <p>Snow, an offwhite that would be good to use</p>
        <div class="box" style="background-color: #584544;"></div>
            <p>Mauve Bark, another brown that fits the coffee theme</p>
        <div class="box" style="background-color: #E8C79C;"></div>
            <p>Apricot Cream, a cream colour that would look good for the buttons</p>
    </body>
</html>
